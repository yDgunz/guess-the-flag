<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Guess the Flag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hud">
    <div class="tier-badge" id="tier-badge">Easy</div>
    <div class="streak-group">
      <div class="streak" id="streak-display">🔥 0</div>
      <div class="best-streak" id="best-streak-display">🏆 0</div>
    </div>
  </header>

  <nav class="mode-bar" id="mode-bar">
    <button class="mode-btn" data-mode="easy">Easy</button>
    <button class="mode-btn" data-mode="medium">Medium</button>
    <button class="mode-btn" data-mode="hard">Hard</button>
    <button class="mode-btn" data-mode="progressive">Progressive</button>
  </nav>

  <main>
    <h1 class="prompt" id="prompt">Loading…</h1>
    <div class="flag-grid" id="flag-grid"></div>
    <button class="map-btn hidden" id="map-btn">🌍 Where is this?</button>
  </main>

  <div class="confetti-layer" id="confetti-layer"></div>

  <div class="map-overlay hidden" id="map-overlay">
    <div class="map-panel">
      <button class="map-close" id="map-close" aria-label="Close map">✕</button>
      <h2 id="map-country-name"></h2>
      <div class="map-svg-wrap" id="map-svg-wrap"></div>
      <p class="map-credit">Map: <a href="https://github.com/VictorCazanave/svg-maps" target="_blank" rel="noopener">svg-maps</a> (CC BY 4.0)</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
